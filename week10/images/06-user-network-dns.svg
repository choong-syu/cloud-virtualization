<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>사용자 정의 네트워크와 내장 DNS</title><rect width="1000" height="420" fill="#ffffff"/><text x="24" y="34" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="700">Task 6. 기본 bridge와 사용자 정의 네트워크의 이름 찾기</text><rect x="24" y="60" width="400" height="330" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="224.0" y="84" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">기본 bridge (docker0)</text><rect x="64" y="140" width="320" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="224.0" y="164" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">busybox</text><text x="224.0" y="188" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">ping -c 1 redis-db</text><text x="224" y="270" font-family="Consolas,'D2Coding',monospace" font-size="15" fill="#dc2626" text-anchor="middle">ping: bad address 'redis-db'</text><text x="224" y="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">이름으로 찾을 수 없음 (IP로만 통신)</text><rect x="456" y="60" width="520" height="330" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="716.0" y="84" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">사용자 정의 네트워크 cv10-net (br-xxxxxxxxxxxx)</text><rect x="480" y="110" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="580.0" y="134" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR