,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="690" y1="258" x2="610" y2="194" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw24)"/><text x="716" y="236" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">② 172.18.0.3</text><defs><marker id="arw27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="682" y1="150" x2="750" y2="150" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw27)"/><text x="716.0" y="142.0" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">③</text></svg>
