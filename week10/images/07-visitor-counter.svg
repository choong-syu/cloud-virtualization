<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img"><title>방문자 카운터 구성</title><rect width="1000" height="430" fill="#ffffff"/><text x="24" y="34" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="700">Task 7. 방문자 카운터: web + redis-db</text><rect x="20" y="140" width="120" height="90" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="80.0" y="164" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">curl</text><text x="80.0" y="188" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">localhost:8080</text><rect x="230" y="50" width="746" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="603.0" y="74" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">cv10-net (사용자 정의 네트워크)</text><rect x="250" y="120" width="280" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="390.0" y="144" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">web  (Stateless)</text><text x="390.0" y="168" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">cv10-web:v1 · Flask :5000</text><text x="390.0" y="186" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">-e REDIS_HOST=redis-db</text><text x="390.0" y="204" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">상태 없음 → 언제든 교체</text><rect x="650" y="120" w