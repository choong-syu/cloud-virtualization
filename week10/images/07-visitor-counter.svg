ill="#1f2937" text-anchor="middle" font-weight="700">볼륨 cv10-redis-data → /data</text><defs><marker id="arw25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="800" y1="252" x2="800" y2="278" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw25)"/><text x="24" y="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700">외부에는 web만 공개(최소 노출)  ·  접속 대상은 -e로 주입  ·  이름은 내장 DNS가 해석  ·  데이터는 볼륨에 보존</text></svg>
