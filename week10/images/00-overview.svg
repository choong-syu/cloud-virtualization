<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img"><title>10주차 실습 전체 흐름</title><rect width="1000" height="460" fill="#ffffff"/><text x="24" y="34" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="700">10주차 실습 흐름: 데이터 영속성 → 컨테이너 네트워크 → 방문자 카운터</text><text x="24" y="70" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#16a34a" text-anchor="start" font-weight="700">데이터 영속성 — 데이터를 어디에, 언제 기록하는가</text><rect x="24" y="84" width="210" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="129.0" y="108" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Task 1</text><text x="129.0" y="132" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">쓰기 레이어와</text><text x="129.0" y="150" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">익명 볼륨</text><defs><marker id="arw7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="236" y1="127" x2="262" y2="127" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw7)"/><rect x="264" y="84" width="210" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="369.0" y="108" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Task 2</text><text x="369.0" y="132" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">Named Volume</text><text x="369.0" y="150" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">수명주기 분리</text><defs><marker id="arw13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="476" y1="127" x2="502" y2="127" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw13)"/><rect x="504" y="84" width="210" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="609.0" y="108" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Task 3</text><text x="609.0" y="132" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">Bind Mount와</text><text x="609.0" y="150" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">빈 볼륨 비교</text><defs><marker id="arw19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="716" y1="127" x2="742" y2="127" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw19)"/><rect x="744" y="84" width="210" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="849.0" y="108" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Task 4</text><text x="849.0" y="132" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">Redis 기록 설정</text><text x="849.0" y="150" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">RDB · AOF</text><text x="24" y="210" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">컨테이너 네트워크 — 어떤 경로로 통신하고, 서로를 어떻게 찾는가</text><rect x="24" y="224" width="330" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="189.0" y="248" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Task 5</text><text x="189.0" y="272" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">docker0 · veth · NAT(-p) 관찰</text><text x="189.0" y="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">5주차 구조와 연결</text><rect x="384" y="224" width="330" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="549.0" y="248" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Task 6</text><text x="549.0" y="272" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">사용자 정의 네트워크 cv10-net</text><text x="549.0" y="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">내장 DNS로 이름 찾기</text><defs><marker id="arw34" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="356" y1="267" x2="382" y2="267" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw34)"/><rect x="24" y="336" width="950" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="499.0" y="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Task 7 · 방문자 카운터 (web + redis-db)</text><text x="499.0" y="384" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">--network cv10-net  ·  -v cv10-redis-data:/data  ·  --appendonly yes  ·  -e REDIS_HOST=redis-db  ·  -p 8080:5000</text><defs><marker id="arw39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="850" y1="172" x2="850" y2="334" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw39)"/><defs><marker id="arw41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="549" y1="312" x2="549" y2="334" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw41)"/><text x="500" y="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">다음 주차(11주차): 이 구성을 compose.yaml 하나로 선언하는 Docker Compose</text></svg>
