<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Bind Mount와 빈 Named Volume 비교</title><rect width="1000" height="400" fill="#ffffff"/><text x="24" y="34" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="700">Task 3. 같은 경로 /usr/share/nginx/html 에 연결했을 때</text><text x="250" y="70" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">Bind Mount (cv10-bind, :8082)</text><text x="750" y="70" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="700">빈 Named Volume (cv10-vol-html, :8083)</text><rect x="60" y="90" width="380" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/><text x="250.0" y="114" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">이미지의 index.html (nginx 기본)</text><text x="250.0" y="138" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">가려짐 — 삭제된 것이 아님</text><rect x="60" y="190" width="380" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="214" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">호스트 ~/week10/html</text><text x="250.0" y="238" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">index.html: &lt;h1&gt;Bind Mount&lt;/h1&gt;</text><text x="250.0" y="256" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">호스트에서 수정 → 즉시 반영, :ro</text><rect x="560" y="90" width="380" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="750.0" y="114" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">이미지의 index.html, 50x.html</text><text x="750.0" y="138" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">볼륨이 비어 있으면 처음 한 번 복사</text><rect x="560" y="190" width="380" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="750.0" y="214" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">볼륨 cv10-html-vol</text><text x="750.0" y="238" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">index.html, 50x.html (복사본)</text><text x="750.0" y="256" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">이미 데이터가 있으면 복사하지 않음</text><defs><marker id="arw18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="750" y1="162" x2="750" y2="188" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw18)"/><text x="780" y="167.0" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">copy</text><text x="250" y="320" font-family="Consolas,'D2Coding',monospace" font-size="15" fill="#2563eb" text-anchor="middle">curl :8082 → &lt;h1&gt;Bind Mount&lt;/h1&gt;</text><text x="750" y="320" font-family="Consolas,'D2Coding',monospace" font-size="15" fill="#16a34a" text-anchor="middle">curl :8083 → Welcome to nginx!</text><text x="500" y="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">개발 중 소스 반영은 Bind Mount, 보존할 서비스 데이터는 Named Volume</text></svg>
