<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>RDB와 AOF 비교</title><rect width="1000" height="420" fill="#ffffff"/><text x="24" y="34" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="700">Task 4. 볼륨은 공간을 제공하고, 기록 시점은 Redis 설정이 결정한다</text><rect x="24" y="60" width="460" height="160" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="254.0" y="84" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">RDB (기본값) · cv10-rdb</text><text x="44" y="112" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#1f2937" text-anchor="start">incr ×3 → 3     docker stop (SIGTERM)</text><text x="44" y="136" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#16a34a" text-anchor="start">  → 종료 직전 dump.rdb 저장 → get hits = 3</text><text x="44" y="166" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#1f2937" text-anchor="start">incr ×3 → 6     docker kill (SIGKILL)</text><text x="44" y="190" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#dc2626" text-anchor="start">  → 저장할 기회 없음 → get hits = 3</text><rect x="516" y="60" width="460" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="746.0" y="84" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">AOF (--appendonly yes) · cv10-aof</text><text x="536" y="112" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#1f2937" text-anchor="start">incr ×3 → 3</text><text x="536" y="136" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#4b5563" text-anchor="start">  → 쓰기 명령마다 incr.aof에 추가</text><text x="536" y="166" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#1f2937" text-anchor="start">docker kill (SIGKILL)</text><text x="536" y="190" font-family="Consolas,'D2Coding',monospace" font-size="14" fill="#16a34a" text-anchor="start">  → get hits = 3 (유지)</text><rect x="24" y="250" width="460" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="254.0" y="274" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">/data (cv10-rdb-data)</text><text x="254.0" y="298" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">dump.rdb — 마지막 스냅샷만 보존</text><rect x="516" y="250" width="460" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="746.0" y="274" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">/data (cv10-aof-data)</text><text x="746.0" y="298" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">appendonlydir/ appendonly.aof.1.incr.aof …</text><defs><marker id="arw20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="254" y1="222" x2="254" y2="248" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw20)"/><defs><marker id="arw22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="746" y1="222" x2="746" y2="248" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw22)"/><text x="500" y="372" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">컨테이너 삭제에 대비하는 것은 볼륨, 갑작스러운 종료에 대비하는 것은 기록 설정(AOF)</text><text x="500" y="398" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">RDB만 있던 볼륨에 처음 AOF를 켜면 빈 AOF로 시작하므로 실습은 볼륨을 따로 사용</text></svg>
