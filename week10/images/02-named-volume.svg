<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>Named Volume 수명주기</title><rect width="1000" height="380" fill="#ffffff"/><text x="24" y="34" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#1f2937" text-anchor="start" font-weight="700">Task 2. Named Volume: 컨테이너는 교체하고 데이터는 이어서 사용</text><rect x="24" y="70" width="280" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="164.0" y="94" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">cv10-redis-a</text><text x="164.0" y="118" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">-v cv10-redis-data:/data</text><text x="164.0" y="136" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">incr hits → 1, 2, 3</text><rect x="696" y="70" width="280" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="836.0" y="94" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">cv10-redis-b</text><text x="836.0" y="117" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">--mount type=volume,</text><text x="836.0" y="134" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">  src=cv10-redis-data,dst=/data</text><text x="836.0" y="151" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">get hits → 3</text><defs><marker id="arw11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="306" y1="125" x2="694" y2="125" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw11)"/><text x="500.0" y="115" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">stop → rm A → run B</text><rect x="260" y="240" width="480" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="500.0" y="264" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Named Volume: cv10-redis-data</text><text x="500.0" y="288" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">/var/lib/docker/volumes/cv10-redis-data/_data</text><text x="500.0" y="306" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">dump.rdb  ·  컨테이너를 삭제해도 남음</text><text x="500.0" y="324" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">삭제는 docker volume rm으로 명시적으로</text><defs><marker id="arw19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="164" y1="182" x2="330" y2="238" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw19)"/><text x="210" y="222" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">/data 마운트</text><defs><marker id="arw22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><line x1="836" y1="182" x2="670" y2="238" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arw22)"/><text x="880" y="222" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">같은 볼륨 다시 연결</text></svg>
